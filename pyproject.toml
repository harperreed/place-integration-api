[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "place-integration-api"
version = "0.3.0"
description = "Python APIs for Cognito-authenticated MQTT flows and Home Assistant discovery for Gentex Place."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name="Nicholas Aelick", email="niaexa@syntronic.com" },
  { name="Andrew Tran", email="andrew.tran@gentex.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "boto3",
  "aiohttp",
  "six",
  "python-decouple",
  "PyJWT",
  "aiomqtt>=2.5.1",
]

[project.optional-dependencies]
dev = [
  "basedpyright",
  "build==1.5.0",
  "pytest",
  "pytest-asyncio",
  "ruff==0.16.2",
  "twine==7.0.0",
]

[project.urls]
Homepage = "https://pypi.org/project/place-integration-api/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
required-version = "==0.9.25"

[tool.basedpyright]
include = ["src/place", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
place = ["py.typed"]
